<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envbench — 瀏覽器預覽</title>
    <style>
      /* 只有瀏覽器預覽用：模擬 macOS 視窗左上角三顆交通燈，讓版面與真實視窗一致 */
      .preview-lights {
        position: fixed;
        top: 17px;
        left: 20px;
        display: flex;
        gap: 8px;
        z-index: 99;
      }
      .preview-lights i {
        display: block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="preview-lights" aria-hidden="true">
      <i style="background: #ff5f57"></i>
      <i style="background: #febc2e"></i>
      <i style="background: #28c840"></i>
    </div>
    <script type="module" src="/src/preview.tsx"></script>
  </body>
</html>
